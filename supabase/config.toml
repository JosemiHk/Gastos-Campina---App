project_id = "campina-gastos"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:4200"
additional_redirect_urls = ["http://127.0.0.1:4200/acceso/confirmar", "http://localhost:4200/acceso/confirmar"]
enable_signup = false
[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"
[auth.email.template.magic_link]
subject = "Tu acceso a Campiña Gastos"
content_path = "./templates/magic-link.html"
