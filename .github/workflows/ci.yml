name: Verificar Campiña Gastos
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-campina-gastos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: app-campina-gastos/package-lock.json
      - run: npm ci
      - run: npm run test:security
      - run: npm run security:check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:db
      - run: npm run test:upgrade
      - run: npm run test:weighted-upgrade
      - run: npm run build
